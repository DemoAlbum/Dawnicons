name: Self Release APK

on:
  workflow_dispatch:
    inputs:
      customTag:
        description: Custom tag
        type: string
        required: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Write sign info
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo storePassword="$KEYSTORE_PASSWORD" >> keystore.properties
            echo keyAlias="$KEY_ALIAS" >> keystore.properties
            echo keyPassword="$KEY_PASSWORD" >> keystore.properties
            echo storeFile="${{ github.workspace }}/key.jks" >> keystore.properties
            echo "$KEYSTORE" | base64 --decode > "${{ github.workspace }}/key.jks"
          fi
      - name: Assign needed environment variables
        run: echo "CUSTOM_TAG=${{ github.event.inputs.customTag }}" >> $GITHUB_ENV
      - name: Build release APK
        run: ./gradlew clean app:assembleRelease
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release APK
          path: app/build/outputs/apk/app/release/*.apk

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release-apk
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: Release APK
          path: artifacts/release-apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.customTag != '' && github.event.inputs.customTag || format('build-{0}', github.run_number) }}
          name: ${{ github.event.inputs.customTag != '' && github.event.inputs.customTag || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: artifacts/release-apk/*.apk
          prerelease: true